const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const ALL = window.__AIRDROPS__ || [];
const NORM = s => (s || '').toLowerCase().trim();

function badgeFor(until) {
  if (!until) return { cls: '', label: 'no deadline' };
  const d = new Date(until + 'T00:00:00Z');
  const today = new Date(); today.setHours(0,0,0,0);
  const days = Math.round((d - today) / 86400000);
  if (days < 0) return { cls: 'expired', label: `${Math.abs(days)}d ago` };
  if (days <= 7) return { cls: 'soon', label: `${days}d left` };
  return { cls: 'live', label: `${days}d left` };
}

function render() {
  const kw   = NORM($('#kw').value);
  const ch   = NORM($('#chain').value);
  const src  = NORM($('#src').value);
  const filt = ALL.filter(a =>
    (!kw  || NORM(a.name).includes(kw) || NORM(a.description).includes(kw)) &&
    (!ch  || NORM(a.chain) === ch) &&
    (!src || NORM(a.source) === src)
  );
  // group by chain
  const groups = {};
  for (const a of filt) {
    const k = a.chain || 'unknown';
    (groups[k] = groups[k] || []).push(a);
  }
  // sort: chains with deadlines first, then by total count
  const order = Object.keys(groups).sort((a, b) => groups[b].length - groups[a].length);

  const root = $('#cards-root');
  root.innerHTML = '';
  for (const chain of order) {
    const items = groups[chain].sort((a, b) => {
      if (!a.until && !b.until) return 0;
      if (!a.until) return 1;
      if (!b.until) return -1;
      return a.until.localeCompare(b.until);
    });
    const sec = document.createElement('section');
    sec.className = 'chain';
    sec.innerHTML = `<h2>${escapeHtml(chain)} · ${items.length}</h2>`;
    const grid = document.createElement('div'); grid.className = 'cards';
    for (const it of items) {
      const b = badgeFor(it.until);
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="name">${escapeHtml(it.name)}</div>
        <div class="src">${escapeHtml(it.source)} ${b.label ? `<span class="tag ${b.cls}">${b.label}</span>` : ''}</div>
        ${it.description ? `<div class="desc">${escapeHtml(it.description)}</div>` : ''}
        ${it.url ? `<a href="${escapeAttr(it.url)}" target="_blank" rel="noopener">${escapeHtml(it.url)}</a>` : ''}
      `;
      grid.appendChild(card);
    }
    sec.appendChild(grid);
    root.appendChild(sec);
  }
  if (!order.length) {
    root.innerHTML = '<div style="color:var(--muted)">no entries match.</div>';
  }
  $('#count').textContent = filt.length + ' / ' + ALL.length;
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function escapeAttr(s) { return escapeHtml(s); }

function populateFilters() {
  const chains = new Set(); const sources = new Set();
  ALL.forEach(a => {
    if (a.chain) chains.add(a.chain);
    if (a.source) sources.add(a.source);
  });
  const c = $('#chain');
  for (const ch of Array.from(chains).sort()) {
    const o = document.createElement('option'); o.value = ch; o.textContent = ch;
    c.appendChild(o);
  }
  const s = $('#src');
  for (const src of Array.from(sources).sort()) {
    const o = document.createElement('option'); o.value = src; o.textContent = src;
    s.appendChild(o);
  }
}

window.addEventListener('DOMContentLoaded', () => {
  populateFilters();
  render();
  ['#kw', '#chain', '#src'].forEach(sel => {
    const el = document.querySelector(sel);
    el.addEventListener('input', render);
    el.addEventListener('change', render);
  });
});

</script>
